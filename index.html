<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KISS OF LIFE Archive</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #fff;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                 Arial, sans-serif;
}

/* 전체 화면 */
.archive {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
}

/* 게시물 */
.post {
    padding: 20px 20px 35px;
    border-bottom: 1px solid #eee;
}

/* 이미지 */
.post img {
    width: 100%;
    display: block;
    border-radius: 14px;
    object-fit: cover;
}

/* 세로 사진 */
.post img.vertical {
    aspect-ratio: 3 / 4;
}

/* 가로 사진 */
.post img.horizontal {
    aspect-ratio: 4 / 3;
}

/* 글 */
.caption {
    margin-top: 14px;
    font-size: 14px;
    line-height: 1.6;
}

/* 날짜 */
.date {
    margin-top: 10px;
    color: #888;
    font-size: 12px;
}

/* 맨 위로 버튼 */
.top-button {
    position: fixed;
    right: 18px;
    bottom: 25px;

    width: 48px;
    height: 48px;

    border: 1px solid #ddd;
    border-radius: 50%;
    background: white;

    font-size: 22px;
    cursor: pointer;

    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.top-button:active {
    transform: scale(.95);
}

/* PC에서 너무 넓어지지 않게 */
@media (min-width: 600px) {
    .archive {
        max-width: 520px;
    }
}
</style>
</head>


<body>

<main class="archive">

    <!-- 게시물 1 -->
    <article class="post">

        <img
            src="images/01.jpg"
            class="vertical"
            alt="KISS OF LIFE">

        <div class="caption">
            KISS OF LIFE
        </div>

        <div class="date">
            2026.08.31
        </div>

    </article>


    <!-- 게시물 2 -->
    <article class="post">

        <img
            src="images/02.jpg"
            class="vertical"
            alt="KISS OF LIFE">

        <div class="caption">
            KISS OF LIFE
        </div>

        <div class="date">
            2026.08.30
        </div>

    </article>


    <!-- 게시물 3 -->
    <article class="post">

        <img
            src="images/03.jpg"
            class="vertical"
            alt="KISS OF LIFE">

        <div class="caption">
            KISS OF LIFE
        </div>

        <div class="date">
            2026.08.29
        </div>

    </article>


    <!-- 게시물 4 -->
    <article class="post">

        <img
            src="images/04.jpg"
            class="vertical"
            alt="KISS OF LIFE">

        <div class="caption">
            KISS OF LIFE
        </div>

        <div class="date">
            2026.08.28
        </div>

    </article>

</main>


<button class="top-button" onclick="goTop()">
    ↑
</button>


<script>
function goTop() {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
</script>

</body>
</html>
